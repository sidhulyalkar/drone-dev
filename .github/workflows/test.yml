name: Engineering screening tests
on: [push, pull_request]
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.mjs
          node --check renderer.mjs
          node --check program_ui.mjs
          node --check qualification_ui.mjs
          node --check engineering_view.mjs
          for file in core/*.mjs; do node --check "$file"; done
          for file in *_ui_v*.mjs mission_3d_v10.mjs mission_scene_ui_v10.mjs; do if [ -f "$file" ]; then node --check "$file"; fi; done
      - name: Run engineering regression tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CAD smoke-test dependencies
        run: python -m pip install -r requirements-cad.txt
      - name: Run CAD and geometry contract smoke tests
        run: npm run test:cad
